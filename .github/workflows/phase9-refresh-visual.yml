name: Phase 9 refresh visual baselines

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase9-refresh-visual.yml"

permissions:
  contents: write

concurrency:
  group: phase9-refresh-visual
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - run: npm install --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:ci
      - run: npm run test:visual:update

      - name: Verify only intended mobile baselines changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only -- e2e/visual.spec.mjs-snapshots/ | sort)
          expected=(
            "e2e/visual.spec.mjs-snapshots/shell-en-dark-mobile-chromium-linux.png"
            "e2e/visual.spec.mjs-snapshots/shell-en-light-mobile-chromium-linux.png"
            "e2e/visual.spec.mjs-snapshots/shell-vi-dark-mobile-chromium-linux.png"
            "e2e/visual.spec.mjs-snapshots/shell-vi-light-mobile-chromium-linux.png"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${changed[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected visual baseline diff.\nChanged:\n%s\n' "${changed[*]}"
            exit 1
          fi

      - name: Commit refreshed baselines and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.mjs-snapshots/*-mobile-chromium-linux.png
          git rm .github/workflows/phase9-refresh-visual.yml
          git commit -m "test(visual): accept Phase 9 mobile touch-target baselines"
          git push origin HEAD:main
