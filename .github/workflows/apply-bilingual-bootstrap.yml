name: Apply bilingual UI bootstrap

on:
  push:
    branches: [feat/bilingual-ui-title]
    paths:
      - ".bootstrap-i18n/**"
      - ".github/workflows/apply-bilingual-bootstrap.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/bilingual-ui-title
      - name: Reconstruct verified archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-i18n/part00 .bootstrap-i18n/part01 .bootstrap-i18n/part02 > /tmp/i18n.b64
          base64 --decode /tmp/i18n.b64 > /tmp/i18n.tar.gz
          echo "b1504955db2c84806c095ba0835f547a09f28b08c32619b7fee1be5ea4c94490  /tmp/i18n.tar.gz" | sha256sum -c -
          tar -xzf /tmp/i18n.tar.gz -C .
          rm -rf .bootstrap-i18n
          rm -f scripts/check-vietnamese-ui.mjs
      - name: Commit bilingual UI source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat(i18n): add bilingual Vietnamese English UI"
          git push origin HEAD:feat/bilingual-ui-title
