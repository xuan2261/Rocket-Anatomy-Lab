name: Refresh visual baselines

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "e2e/**"
      - "playwright.config.mjs"
      - "package.json"
      - ".github/workflows/refresh-visual-baselines.yml"

permissions:
  contents: read

concurrency:
  group: refresh-visual-baselines
  cancel-in-progress: true

jobs:
  refresh:
    name: Generate reviewed UI baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-fund --no-audit
      - run: npm run fetch:source
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:update
      - name: Upload refreshed visual baselines
        uses: actions/upload-artifact@v7
        with:
          name: refreshed-visual-baselines
          path: e2e/visual.spec.mjs-snapshots/
          retention-days: 2
