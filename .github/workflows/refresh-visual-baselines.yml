name: Refresh visual baselines

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "e2e/**"
      - "playwright.config.mjs"
      - "package.json"
      - ".github/workflows/refresh-visual-baselines.yml"

permissions:
  contents: write

concurrency:
  group: refresh-visual-baselines
  cancel-in-progress: true

jobs:
  refresh:
    name: Generate and commit reviewed UI baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-fund --no-audit
      - run: npm run build
      - run: npm run fetch:source
      - run: npx playwright install --with-deps chromium

      - name: Generate eight reviewed visual baselines
        shell: bash
        run: |
          set -euo pipefail
          rm -f e2e/visual.spec.mjs-snapshots/*.png
          set +e
          timeout 180s npm run test:visual:update
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "visual baseline generation failed with exit code $code"
            exit "$code"
          fi
          count="$(find e2e/visual.spec.mjs-snapshots -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          echo "Generated baseline count: $count"
          test "$count" -eq 8

      - name: Reconcile Phase 7 baseline contract
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/phase7-contract.test.mjs")
          text = path.read_text()
          old = """test('four CI-native golden snapshots are committed', () => {
            const files = fs.readdirSync(snapshotDir).filter(name => name.endsWith('.png')).sort()
            assert.deepEqual(files, [
              'shell-en-desktop-chromium-linux.png',
              'shell-en-mobile-chromium-linux.png',
              'shell-vi-desktop-chromium-linux.png',
              'shell-vi-mobile-chromium-linux.png',
            ])
          })"""
          new = """test('eight CI-native theme and language golden snapshots are committed', () => {
            const files = fs.readdirSync(snapshotDir).filter(name => name.endsWith('.png')).sort()
            assert.deepEqual(files, [
              'shell-en-dark-desktop-chromium-linux.png',
              'shell-en-dark-mobile-chromium-linux.png',
              'shell-en-light-desktop-chromium-linux.png',
              'shell-en-light-mobile-chromium-linux.png',
              'shell-vi-dark-desktop-chromium-linux.png',
              'shell-vi-dark-mobile-chromium-linux.png',
              'shell-vi-light-desktop-chromium-linux.png',
              'shell-vi-light-mobile-chromium-linux.png',
            ])
          })"""
          if old not in text:
              raise SystemExit("Expected Phase 7 golden-snapshot contract not found")
          path.write_text(text.replace(old, new))

      - name: Remove one-time generator and commit baselines to main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-visual-baselines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.mjs-snapshots tests/phase7-contract.test.mjs .github/workflows/refresh-visual-baselines.yml
          git diff --cached --stat
          git commit -m "test(visual): refresh workspace theme baselines"
          git push origin HEAD:main
