name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Serialize deployments. A delayed/old trigger cannot cancel a newer deployment;
# the live main-head guard rejects stale candidates instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    name: Verify exact-commit CI
    if: >-
      github.repository == 'xuan2261/Rocket-Anatomy-Lab' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.ci.outputs.ci_run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate trusted CI and current main before build
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-pages-ci.mjs

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        run: bash scripts/lint-workflows.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-fund --no-audit
      - run: npm run verify:ci
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ needs.gate.outputs.sha }}
          path: public

  deploy:
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      sha: ${{ needs.gate.outputs.sha }}
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Recheck CI and main immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CI_RUN_ID: ${{ needs.gate.outputs.ci_run_id }}
          EXPECTED_CI_RUN_ATTEMPT: ${{ needs.gate.outputs.ci_run_attempt }}
        run: node scripts/check-pages-ci.mjs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ needs.gate.outputs.sha }}

  smoke:
    name: Smoke deployed Pages
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify deployed app shell
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run smoke:deployed
