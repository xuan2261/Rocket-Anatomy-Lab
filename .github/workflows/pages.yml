name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Serialize deployments. A delayed/old trigger cannot cancel a newer deployment;
# the live main-head guard rejects stale candidates instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    name: Verify exact-commit CI
    if: >-
      github.repository == 'xuan2261/Rocket-Anatomy-Lab' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.ci.outputs.ci_run_attempt }}
      site_artifact_id: ${{ steps.ci.outputs.site_artifact_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate trusted CI, current main and the tested artifact identity
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-pages-ci.mjs

  promote:
    name: Promote tested payload (no rebuild)
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tar_sha256: ${{ steps.payload.outputs.tar_sha256 }}
      pages_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        run: bash scripts/lint-workflows.sh
      - name: Download by immutable artifact ID from the admitted CI run
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.gate.outputs.site_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.gate.outputs.ci_run_id }}
          path: ${{ runner.temp }}/tested-site/
          digest-mismatch: error
      - name: Verify provenance, complete file manifest and both test receipts
        id: payload
        env:
          SITE_PACKAGE_DIR: ${{ runner.temp }}/tested-site
          SITE_SHA: ${{ needs.gate.outputs.sha }}
          SITE_RUN_ID: ${{ needs.gate.outputs.ci_run_id }}
          SITE_RUN_ATTEMPT: ${{ needs.gate.outputs.ci_run_attempt }}
        run: python3 scripts/site_artifact.py verify
      # deploy-pages resolves artifacts in this workflow. Forward the tar bytes
      # verbatim; do not use upload-pages-artifact, which would create a new tar.
      - name: Forward the identical tar for the Pages transport
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: github-pages-${{ needs.gate.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-site/artifact.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  deploy:
    needs: [gate, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      sha: ${{ needs.gate.outputs.sha }}
      page_url: ${{ steps.deployment.outputs.page_url }}
      site_artifact_id: ${{ needs.gate.outputs.site_artifact_id }}
      ci_run_id: ${{ needs.gate.outputs.ci_run_id }}
      ci_run_attempt: ${{ needs.gate.outputs.ci_run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Download the exact forwarded Pages transport by ID
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.promote.outputs.pages_artifact_id }}
          path: ${{ runner.temp }}/pages-payload/
          digest-mismatch: error
      - name: Recheck the payload checksum immediately before deployment
        env:
          SITE_PACKAGE_DIR: ${{ runner.temp }}/pages-payload
          SITE_TAR_SHA256: ${{ needs.promote.outputs.tar_sha256 }}
        run: python3 scripts/site_artifact.py hash
      - name: Recheck CI, main and source artifact identity before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CI_RUN_ID: ${{ needs.gate.outputs.ci_run_id }}
          EXPECTED_CI_RUN_ATTEMPT: ${{ needs.gate.outputs.ci_run_attempt }}
          EXPECTED_SITE_ARTIFACT_ID: ${{ needs.gate.outputs.site_artifact_id }}
        run: node scripts/check-pages-ci.mjs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ needs.gate.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  smoke:
    name: Smoke deployed Pages
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.deploy.outputs.site_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.deploy.outputs.ci_run_id }}
          path: ${{ runner.temp }}/tested-site/
          digest-mismatch: error
      - name: Compare every deployed static file with the tested manifest
        env:
          SITE_PACKAGE_DIR: ${{ runner.temp }}/tested-site
          SITE_SHA: ${{ needs.deploy.outputs.sha }}
          SITE_RUN_ID: ${{ needs.deploy.outputs.ci_run_id }}
          SITE_RUN_ATTEMPT: ${{ needs.deploy.outputs.ci_run_attempt }}
          SITE_LIVE_REPORT: ${{ runner.temp }}/deployed-byte-check.json
        run: python3 scripts/site_artifact.py live
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify deployed app shell
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run smoke:deployed
      - name: Retain deployed-byte evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: deployed-byte-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployed-byte-check.json
          if-no-files-found: error
          retention-days: 14
