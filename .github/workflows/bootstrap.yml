name: Bootstrap source tree

on:
  push:
    branches:
      - feat/initialize-vietnamese-app
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Giải nén mã nguồn
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/seg* > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.xz
          xz -d /tmp/project.tar.xz
          tar -xf /tmp/project.tar -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml

      - name: Commit cây mã nguồn
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: initialize Vietnamese Rocket Anatomy Lab"
          git push
